<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adel site</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
#loginVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#cover{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:1}
.content{position:relative;z-index:2;padding-top:110px}
.avatar{width:120px;height:120px;border-radius:50%;background:#000;border:4px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;margin:auto}
.names{display:flex;gap:10px;max-width:360px;margin:20px auto}
.names div{flex:1;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:16px;padding:12px}
.names span{display:block;color:#facc15}
input{width:320px;max-width:90%;padding:14px;border-radius:14px;border:1px solid #fff;background:#000;color:#fff;text-align:center}
button{width:320px;max-width:90%;padding:16px;border:none;border-radius:16px;background:#22d3ee;font-weight:900;font-size:18px;margin-top:12px}
</style>
</head>
<body>
<video id="loginVideo" autoplay muted loop playsinline preload="auto" src="bg.mp4"></video>
<div id="cover"></div>
<div class="content">
<div class="avatar">A</div>
<h1>Adel | عادل</h1>
<p>⚡ أهلاً بيك في موقع البرق</p>
<div class="names"><div>👑 عادل<span>01062056341</span></div><div>صبري<span>01027436412</span></div></div>
<input placeholder="اكتب اسمك هنا"><br>
<button onclick="alert('نورت 👑⚡')">⚡ تسجيل دخول</button>
</div>
<script>
var v=document.getElementById('loginVideo');
v.addEventListener('loadedmetadata',function(){ v.currentTime=2; v.play(); });
setTimeout(function(){ v.currentTime=2; v.play(); },1000);
document.addEventListener('click',function(){ v.play(); });
</script>
</body>
</html>
