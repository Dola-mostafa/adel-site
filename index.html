<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع عادل ⚡</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;color:#fff;overflow-x:hidden}
video#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:-1}
#lock{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.lock-box{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:35px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 30px rgba(255,255,255,.2)}
.lock-box h2{margin:0 0 8px;font-size:32px;text-shadow:0 0 12px #fff}
.lock-box p{color:#ccc;margin:0 0 22px;font-size:17px}
.lock-box input{width:100%;padding:18px;border-radius:14px;border:1px solid #fff;background:rgba(255,255,255,.12);color:#fff;font-size:20px;text-align:center;outline:none;margin-bottom:14px}
.lock-box input::placeholder{color:#aaa}
.lock-box button{width:100%;background:#fff;color:#000;border:none;padding:18px;border-radius:14px;font-size:21px;font-weight:bold;cursor:pointer}
#err{color:#ff5c5c;font-size:15px;margin-top:10px;display:none}
.wrap{padding:16px;padding-bottom:40px;display:none}
h1{text-align:center;color:#fff;text-shadow:0 0 15px #fff,0 0 30px #00e5ff;margin:12px 0 8px;font-size:38px}
p.sub{text-align:center;color:#ddd;margin:0 0 22px;font-size:18px}
.box{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:24px;max-width:650px;margin:0 auto 22px;backdrop-filter:blur(8px);box-shadow:0 0 25px rgba(255,255,255,.15)}
.box h2{text-align:center;color:#fff;margin:0 0 18px;text-shadow:0 0 10px #fff;font-size:27px}
label{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);padding:18px 14px;border-radius:14px;margin-bottom:12px;font-weight:bold;cursor:pointer;border:1px solid rgba(255,255,255,.25);font-size:20px}
label input{width:26px;height:26px;accent-color:#fff;flex-shrink:0}
.btn{width:100%;background:#fff;color:#000;border:none;padding:18px;border-radius:14px;font-size:21px;font-weight:bold;cursor:pointer;margin-top:12px}
#viewer{display:none;width:100%;max-width:650px;height:600px;border:2px solid #fff;border-radius:14px;margin:0 auto;background:#fff}
.note{text-align:center;font-size:14px;color:#ccc;margin-top:10px}
</style>
</head>
<body>

<video id="bg" autoplay muted playsinline>
  <source src="lightning.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div id="lock">
  <div class="lock-box">
    <div style="font-size:65px">⚡👑</div>
    <h2>موقع عادل</h2>
    <p>دخل الباسورد عشان تخش</p>
    <input type="password" id="pass" placeholder="اكتب الباسورد هنا" inputmode="numeric">
    <button onclick="checkPass()">دخول ⚡</button>
    <div id="err">الباسورد غلط، جرب تاني</div>
  </div>
</div>

<div class="wrap" id="site">
<h1>👑 موقع عادل ⚡</h1>
<p class="sub">افتح كل حاجة من هنا من غير تحميل</p>

<div class="box">
  <h2>⚡ التطبيقات</h2>
  <label><input type="radio" name="app" value="https://www.youtube.com"> ▶️ يوتيوب</label>
  <label><input type="radio" name="app" value="https://chatgpt.com"> 🤖 شات جي بي تي</label>
  <label><input type="radio" name="app" value="https://www.facebook.com"> 📘 فيسبوك</label>
  <label><input type="radio" name="app" value="https://web.telegram.org"> ✈️ تليجرام</label>
  <label><input type="radio" name="app" value="https://www.instagram.com"> 📸 انستجرام</label>
  <label><input type="radio" name="app" value="https://www.pubgmobile.com"> 🔫 ببجي</label>
  <button class="btn" onclick="openApp()">افتح التطبيق ⚡</button>
  <div class="note">لو التطبيق مرضيش يفتح جوه الموقع، هيفتح في صفحة جديدة لوحده</div>
</div>

<div class="box">
  <h2>📚 كتب الصف الأول الثانوي - الترم الأول</h2>
  <label><input type="radio" name="book" value="pdf/arabic.pdf"> 📖 العربي - كتاب الامتحان</label>
  <label><input type="radio" name="book" value="pdf/social.pdf"> 🌍 الدراسات - كتاب الامتحان</label>
  <label><input type="radio" name="book" value="pdf/science.pdf"> 🔬 العلوم - كتاب الامتحان</label>
  <label><input type="radio" name="book" value="pdf/english.pdf"> 🇬🇧 الانجليزي - كتاب المعاصر</label>
  <label><input type="radio" name="book" value="pdf/math.pdf"> ➗ الرياضيات - كتاب المعاصر</label>
  <label><input type="radio" name="book" value="pdf/religion.pdf"> 🕌 الدين - كتاب المدرسة</label>
  <label><input type="radio" name="book" value="pdf/french.pdf"> 🇫🇷 الفرنساوي</label>
  <button class="btn" onclick="openBook()">افتح الكتاب 📖</button>
</div>

<iframe id="viewer"></iframe>
</div>

<script>
let bg = document.getElementById('bg');
bg.addEventListener('timeupdate', function(){
  if(bg.currentTime > 12.5){ bg.currentTime = 0; bg.play(); }
});
function checkPass(){
  let p = document.getElementById('pass').value;
  let k = [50,52,49,50,50,48,49,48].map(c=>String.fromCharCode(c)).join('');
  if(p === k){
    document.getElementById('lock').style.display = 'none';
    document.getElementById('site').style.display = 'block';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pass').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ checkPass(); }
});
function openApp(){
  let s = document.querySelector('input[name=app]:checked');
  if(!s){ alert('اختار تطبيق الأول'); return; }
  let v = document.getElementById('viewer');
  v.style.display='block';
  v.src = s.value;
  v.scrollIntoView({behavior:'smooth'});
}
function openBook(){
  let s = document.querySelector('input[name=book]:checked');
  if(!s){ alert('اختار كتاب الأول'); return; }
  let v = document.getElementById('viewer');
  v.style.display='block';
  v.src = s.value;
  v.scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
