<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عادل | دخول خاص</title>
<style>
* { box-sizing: border-box; font-family: sans-serif; }
body { margin:0; min-height:100vh; background: linear-gradient(135deg,#0f172a,#1e293b); display:flex; align-items:center; justify-content:center; padding:20px; color:#fff; }
.card { background:#fff; color:#111; width:100%; max-width:420px; border-radius:20px; padding:25px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
h1 { text-align:center; font-size:24px; margin:0 0 5px; }
p.sub { text-align:center; color:#666; font-size:14px; margin:0 0 20px; }
label { font-weight:bold; font-size:14px; display:block; margin:12px 0 6px; }
input { width:100%; padding:13px; border:2px solid #e5e7eb; border-radius:12px; font-size:16px; outline:none; text-align:center; }
input:focus { border-color:#2563eb; }
button { width:100%; padding:14px; border:none; border-radius:12px; background:#2563eb; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; margin-top:18px; }
button:disabled { opacity:.6; }
.msg { text-align:center; margin-top:15px; font-size:15px; font-weight:bold; min-height:22px; }
.success { color:#16a34a; }
.error { color:#dc2626; }
.wait { color:#d97706; }
.hidden { display:none; }
.welcome { text-align:center; }
.welcome h2 { font-size:26px; }
.welcome p { color:#555; }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>👑site أهلاً بيك في عادل</h1>
  <p class="sub">سجل دخولك عشان تشوف الشرح</p>

  <label>الاسم</label>
  <input id="name" placeholder="اكتب اسمك" />

  <label>رقم الموبايل</label>
  <input id="phone" placeholder="01xxxxxxxxx" inputmode="numeric" maxlength="11" />

  <button id="btn" onclick="checkLogin()">دخول</button>
  <div class="msg" id="msg"></div>

  <div id="requestBox" class="hidden">
    <button onclick="requestAccess()" style="background:#f59e0b;">اطلب دخول من عادل</button>
  </div>
</div>

<div class="card hidden" id="welcomeCard">
  <div class="welcome">
    <h2>✅ نورت يا <span id="userName"></span></h2>
    <p>تم قبولك، تقدر تشوف الشرح دلوقتي</p>
    <p style="font-size:28px;">📚 شرح عادل هنا</p>
    <button onclick="logout()" style="background:#64748b;">خروج</button>
  </div>
</div>

<script>
// ============ عدل السطرين دول بس ============
const BOT_TOKEN = "9124807544";
const MY_ID = "8319528597";
// ==========================================

const msg = document.getElementById('msg');

async function getAllowed(){
  try{
    const r = await fetch('allowed.json?v=' + Date.now());
    const data = await r.json();
    return data;
  }catch(e){ return []; }
}

async function checkLogin(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const btn = document.getElementById('btn');

  if(!name || !phone){
    msg.textContent = "اكتب الاسم ورقم الموبايل";
    msg.className = "msg error";
    return;
  }
  if(phone.length !== 11 || !phone.startsWith('01')){
    msg.textContent = "رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 01";
    msg.className = "msg error";
    return;
  }

  btn.disabled = true;
  btn.textContent = "جاري التأكد...";
  msg.textContent = "";
  msg.className = "msg";

  const allowed = await getAllowed();
  const cleanPhone = phone.replace(/\D/g,'');

  if(allowed.includes(cleanPhone)){
    document.getElementById('userName').textContent = name;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('welcomeCard').classList.remove('hidden');
    localStorage.setItem('adel_user', name);
  } else {
    msg.textContent = "رقمك مش مسموح له بالدخول";
    msg.className = "msg error";
    document.getElementById('requestBox').classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = "دخول";
  }
}

async function requestAccess(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();

  msg.textContent = "جاري إرسال طلبك لعادل...";
  msg.className = "msg wait";

  const text = `🔔 طلب دخول جديد\n\n👤 الاسم: ${name}\n📱 الرقم: ${phone}\n\nعشان تقبله، ضيف الرقم ده في allowed.json`;

  try{
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: MY_ID, text: text })
    });
    if(res.ok){
      msg.textContent = "✅ تم إرسال طلبك لعادل، استنى يقبلك";
      msg.className = "msg success";
    } else {
      msg.textContent = "حصل مشكلة في الإرسال، جرب تاني";
      msg.className = "msg error";
    }
  }catch(e){
    msg.textContent = "حصل مشكلة في الاتصال";
    msg.className = "msg error";
  }
}

function logout(){
  localStorage.removeItem('adel_user');
  location.reload();
}
</script>
</body>
</html>
